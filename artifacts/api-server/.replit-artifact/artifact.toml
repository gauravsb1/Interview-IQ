kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "uv run python python/run.py"

[services.production]
[services.production.build]
args = ["uv", "sync", "--frozen"]
[services.production.run]
args = ["uv", "run", "python", "artifacts/api-server/python/run.py"]
[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
[services.production.health.startup]
path = "/api/healthz"
