openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /auth/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
  /auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Credentials"}
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Credentials"}
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: Signed out
  /profile:
    get:
      operationId: getProfile
      responses:
        "200":
          description: Extracted resume
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
    post:
      operationId: uploadResume
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/ResumeUpload"}
      responses:
        "200":
          description: Extracted profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
    delete:
      operationId: deleteProfile
      responses:
        "200":
          description: Stored resume removed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeleteProfileResult"}
        "409":
          description: Resume deletion is blocked while interview sessions are active
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Real statistics for signed-in users, labeled sample for visitors
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dashboard"}
  /sessions:
    get:
      operationId: listSessions
      responses:
        "200":
          description: Interview history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Interview"}
    post:
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InterviewInput"}
      responses:
        "200":
          description: First question
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Interview"}
  /sessions/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getSession
      responses:
        "200":
          description: Interview with answer evaluations
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Interview"}
    delete:
      operationId: deleteSession
      responses:
        "200":
          description: Deleted
  /sessions/{id}/answers:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: submitAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AnswerInput"}
      responses:
        "200":
          description: Updated interview and next question
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Interview"}
  /sessions/{id}/finish:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: finishSession
      responses:
        "200":
          description: Completed interview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Interview"}
  /sessions/{id}/next-question:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: retryQuestion
      responses:
        "200":
          description: Interview with its next generated question
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Interview"}
  /transcribe:
    post:
      operationId: transcribe
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/AudioUpload"}
      responses:
        "200":
          description: Whisper transcript and speech timing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transcript"}
  /sessions/{id}/ratings:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: saveRating
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RatingInput"}
      responses:
        "200":
          description: Updated interview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Interview"}
  /sessions/{id}/ratings/feedback:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: generateRatingFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RatingFeedbackInput"}
      responses:
        "200":
          description: Interview with generated comparison feedback
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Interview"}
        "503":
          description: The rating was saved but comparison feedback is unavailable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /admin/session:
    get:
      operationId: getAdminSession
      responses:
        "200":
          description: Whether this browser has an authenticated admin session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminSession"}
  /admin/login:
    post:
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminLoginInput"}
      responses:
        "200":
          description: Admin session established
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminSession"}
        "401":
          description: Invalid admin credentials
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /admin/logout:
    post:
      operationId: adminLogout
      responses:
        "200":
          description: Admin session cleared
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeleteProfileResult"}
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        "200":
          description: Aggregate user and interview performance metrics
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminOverview"}
  /admin/traffic:
    get:
      operationId: getAdminTraffic
      responses:
        "200":
          description: Anonymous page-view and unique-browser totals for the last 30 days
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminTraffic"}
  /analytics/pageview:
    post:
      operationId: recordPageview
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PageviewInput"}
      responses:
        "202":
          description: Anonymous page view accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PageviewResult"}
        "400":
          description: Invalid page view data
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /admin/users:
    get:
      operationId: getAdminUsers
      parameters:
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 120}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: Paginated user summaries with interview performance
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUsersPage"}
  /admin/users/{user_id}:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getAdminUser
      responses:
        "200":
          description: Full stored profile, interview answers, scores, and transcripts for one user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUserDetail"}
        "404":
          description: User not found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /chat/rooms:
    get:
      operationId: getChatRooms
      responses:
        "200":
          description: Public rooms and the authenticated user's direct conversations
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatRoomsResponse"}
  /chat/friends:
    get:
      operationId: getChatFriends
      responses:
        "200":
          description: Accepted friends and pending friend requests for the authenticated user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatFriendsResponse"}
  /chat/friend-requests:
    post:
      operationId: sendFriendRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FriendRequestInput"}
      responses:
        "200":
          description: Friend request state for the selected student
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FriendRequestResult"}
  /chat/friend-requests/{request_id}/accept:
    parameters:
      - {name: request_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: acceptFriendRequest
      responses:
        "200":
          description: Friend request accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FriendActionResult"}
  /chat/friend-requests/{request_id}/decline:
    parameters:
      - {name: request_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: declineFriendRequest
      responses:
        "200":
          description: Friend request declined
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FriendActionResult"}
  /chat/students:
    get:
      operationId: searchChatStudents
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 80}}
      responses:
        "200":
          description: Matching student names, excluding the authenticated user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatStudentsResponse"}
  /chat/rooms/direct:
    post:
      operationId: createDirectChat
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DirectChatInput"}
      responses:
        "200":
          description: Existing or newly created one-to-one conversation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatRoom"}
        "404":
          description: Student not found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /chat/rooms/{room_id}/join:
    parameters:
      - {name: room_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: joinChatRoom
      responses:
        "200":
          description: Joined public room
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatRoom"}
  /chat/rooms/{room_id}/leave:
    parameters:
      - {name: room_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: leaveChatRoom
      responses:
        "200":
          description: Left public room
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatActionResult"}
  /chat/rooms/{room_id}/messages:
    parameters:
      - {name: room_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getChatMessages
      responses:
        "200":
          description: Latest 100 messages visible to a room member
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatMessagesResponse"}
    post:
      operationId: sendChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatMessageInput"}
      responses:
        "201":
          description: Message saved and broadcast to connected room members
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatMessage"}
  /chat/rooms/{room_id}/images:
    parameters:
      - {name: room_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: uploadChatImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/ChatImageUploadInput"}
      responses:
        "201":
          description: Private image uploaded to a room
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatImageUpload"}
  /chat/images/{image_id}:
    parameters:
      - {name: image_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getChatImage
      responses:
        "200":
          description: Private image, available only to room members
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
            image/gif: {}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        name: {type: string}
        email: {type: string}
        password: {type: string, minLength: 10}
    User:
      type: object
      required: [id, name, email]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
    ResumeUpload:
      type: object
      required: [file]
      properties:
        file: {type: string, format: binary}
    AudioUpload:
      type: object
      required: [file]
      properties:
        file: {type: string, format: binary}
    Profile:
      type: object
      required: [filename, skills, projects, education, certifications, experience]
      properties:
        filename: {type: string}
        skills: {type: array, items: {type: string}}
        projects: {type: array, items: {type: string}}
        education: {type: array, items: {type: string}}
        certifications: {type: array, items: {type: string}}
        experience: {type: array, items: {type: string}}
    DeleteProfileResult:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: {type: string}
    InterviewInput:
      type: object
      required: [category, role]
      properties:
        category: {type: string, enum: [technical, hr, behavioral, company-specific]}
        role: {type: string}
        company: {type: string}
        companyContext: {type: string, maxLength: 8000}
        questionCount: {type: integer, minimum: 3, maximum: 10, default: 5}
        timeLimitMinutes: {type: integer, minimum: 1, maximum: 120, default: 15}
        recordingLimitMinutes: {type: integer, minimum: 1, default: 5}
    AnswerInput:
      type: object
      required: [text, questionIndex]
      properties:
        text: {type: string}
        questionIndex: {type: integer}
        transcriptId: {type: string}
    Transcript:
      type: object
      required: [id, text, duration, speakingRate, pauses, silenceDuration, fillerWords]
      properties:
        id: {type: string}
        text: {type: string}
        duration: {type: number}
        speakingRate: {type: number}
        pauses: {type: integer}
        silenceDuration: {type: number}
        fillerWords: {type: integer}
    Scores:
      type: object
      required: [technicalAccuracy, clarity, completeness, star]
      properties:
        technicalAccuracy: {type: number}
        clarity: {type: number}
        completeness: {type: number}
        star: {type: number}
    ContextSource:
      type: object
      required: [source, text, similarity]
      properties:
        source: {type: string}
        text: {type: string}
        similarity: {type: number}
    Answer:
      type: object
      required: [question, text, scores, feedback, improvement, skill]
      properties:
        question: {type: string}
        text: {type: string}
        scores: {$ref: "#/components/schemas/Scores"}
        feedback: {type: string}
        improvement: {type: string}
        skill: {type: string}
        speech: {$ref: "#/components/schemas/Transcript"}
        contextUsed: {type: array, items: {$ref: "#/components/schemas/ContextSource"}}
    RatingInput:
      type: object
      required: [answerIndex, rater, scores, blindReviewed]
      properties:
        answerIndex: {type: integer}
        rater: {type: string}
        scores: {$ref: "#/components/schemas/Scores"}
        notes: {type: string}
        blindReviewed: {type: boolean, const: true}
    Rating:
      type: object
      required: [answerIndex, rater, scores]
      properties:
        answerIndex: {type: integer}
        rater: {type: string}
        scores: {$ref: "#/components/schemas/Scores"}
        notes: {type: string}
        blindReviewed: {type: boolean}
        llmFeedback: {type: string}
    RatingFeedbackInput:
      type: object
      required: [answerIndex, rater]
      properties:
        answerIndex: {type: integer}
        rater: {type: string}
    Interview:
      type: object
      required: [id, category, role, company, createdAt, status, questionCount, currentQuestion, answers, score, ratings]
      properties:
        id: {type: string}
        category: {type: string}
        role: {type: string}
        company: {type: string}
        companyContext: {type: string}
        createdAt: {type: string}
        startedAt: {type: string, format: date-time}
        deadlineAt: {type: string, format: date-time}
        status: {type: string, enum: [active, completed]}
        questionCount: {type: integer}
        timeLimitMinutes: {type: integer, minimum: 1, maximum: 120}
        recordingLimitMinutes: {type: integer, minimum: 1}
        currentQuestion: {type: string}
        currentContext: {type: array, items: {$ref: "#/components/schemas/ContextSource"}}
        nextQuestionPending: {type: boolean}
        answers: {type: array, items: {$ref: "#/components/schemas/Answer"}}
        score: {type: number}
        ratings: {type: array, items: {$ref: "#/components/schemas/Rating"}}
    Trend:
      type: object
      required: [date, score]
      properties:
        date: {type: string}
        score: {type: number}
    Skill:
      type: object
      required: [name, score]
      properties:
        name: {type: string}
        score: {type: number}
    Dashboard:
      type: object
      required: [demo, totalSessions, averageScore, totalAnswers, improvement, trends, skills, recentSessions]
      properties:
        demo: {type: boolean}
        totalSessions: {type: integer}
        averageScore: {type: number}
        totalAnswers: {type: integer}
        improvement: {type: number}
        trends: {type: array, items: {$ref: "#/components/schemas/Trend"}}
        skills: {type: array, items: {$ref: "#/components/schemas/Skill"}}
        recentSessions: {type: array, items: {$ref: "#/components/schemas/Interview"}}
    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 12}
    AdminSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: {type: boolean}
    AdminOverview:
      type: object
      required: [totalUsers, totalSessions, completedSessions, totalAnswers, averageScore, sessionsByMonth, performanceByCategory]
      properties:
        totalUsers: {type: integer}
        totalSessions: {type: integer}
        completedSessions: {type: integer}
        totalAnswers: {type: integer}
        averageScore: {type: number, nullable: true}
        sessionsByMonth:
          type: array
          items:
            type: object
            required: [month, sessions, answers]
            properties:
              month: {type: string}
              sessions: {type: integer}
              answers: {type: integer}
        performanceByCategory:
          type: array
          items:
            type: object
            required: [category, sessions, averageScore]
            properties:
              category: {type: string}
              sessions: {type: integer}
              averageScore: {type: number}
    PageviewInput:
      type: object
      required: [visitorId, pagePath]
      properties:
        visitorId: {type: string, minLength: 36, maxLength: 36}
        pagePath: {type: string, maxLength: 200}
    PageviewResult:
      type: object
      required: [accepted]
      properties:
        accepted: {type: boolean}
    AdminTraffic:
      type: object
      required: [windowDays, pageViews, uniqueVisitors, daily, topPages]
      properties:
        windowDays: {type: integer}
        pageViews: {type: integer}
        uniqueVisitors: {type: integer}
        daily: {type: array, items: {$ref: "#/components/schemas/TrafficDay"}}
        topPages: {type: array, items: {$ref: "#/components/schemas/TrafficPage"}}
    TrafficDay:
      type: object
      required: [date, pageViews, uniqueVisitors]
      properties:
        date: {type: string, format: date}
        pageViews: {type: integer}
        uniqueVisitors: {type: integer}
    TrafficPage:
      type: object
      required: [pagePath, pageViews, uniqueVisitors]
      properties:
        pagePath: {type: string}
        pageViews: {type: integer}
        uniqueVisitors: {type: integer}
    AdminUserSummary:
      type: object
      required: [id, name, email, createdAt, lastLoginAt, totalSessions, totalAnswers, averageScore]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        createdAt: {type: string}
        lastLoginAt: {type: string}
        totalSessions: {type: integer}
        totalAnswers: {type: integer}
        averageScore: {type: number, nullable: true}
    AdminUsersPage:
      type: object
      required: [users, total, limit, offset]
      properties:
        users: {type: array, items: {$ref: "#/components/schemas/AdminUserSummary"}}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
    AdminProfile:
      type: object
      properties:
        filename: {type: string}
        text: {type: string}
        skills: {type: array, items: {type: string}}
        projects: {type: array, items: {type: string}}
        education: {type: array, items: {type: string}}
        certifications: {type: array, items: {type: string}}
        experience: {type: array, items: {type: string}}
    AdminUserDetail:
      type: object
      required: [user, profile, sessions, transcripts]
      properties:
        user: {$ref: "#/components/schemas/AdminUserSummary"}
        profile: {$ref: "#/components/schemas/AdminProfile"}
        sessions: {type: array, items: {$ref: "#/components/schemas/Interview"}}
        transcripts: {type: array, items: {$ref: "#/components/schemas/Transcript"}}
    ChatParticipant:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    ChatRoom:
      type: object
      required: [id, name, description, isPublic, isMember, createdAt]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        isPublic: {type: boolean}
        isMember: {type: boolean}
        createdAt: {type: string, format: date-time}
        lastMessage: {type: string}
        lastMessageAt: {type: string, format: date-time}
        otherUser: {$ref: "#/components/schemas/ChatParticipant"}
    ChatRoomsResponse:
      type: object
      required: [rooms]
      properties:
        rooms: {type: array, items: {$ref: "#/components/schemas/ChatRoom"}}
    ChatStudent:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    ChatStudentsResponse:
      type: object
      required: [students]
      properties:
        students: {type: array, items: {$ref: "#/components/schemas/ChatStudent"}}
    ChatFriendRequest:
      type: object
      required: [id, userId, name, createdAt]
      properties:
        id: {type: string}
        userId: {type: string}
        name: {type: string}
        createdAt: {type: string, format: date-time}
    ChatFriendsResponse:
      type: object
      required: [friends, incomingRequests, outgoingRequests]
      properties:
        friends: {type: array, items: {$ref: "#/components/schemas/ChatStudent"}}
        incomingRequests: {type: array, items: {$ref: "#/components/schemas/ChatFriendRequest"}}
        outgoingRequests: {type: array, items: {$ref: "#/components/schemas/ChatFriendRequest"}}
    FriendRequestInput:
      type: object
      required: [userId]
      properties:
